name: Source install

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/source-install.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "docs/next/INSTALL.md"
      - "justfile"
      - "rust-toolchain.toml"
      - "scripts/source_install_check.py"
      - "scripts/install-from-source.sh"
      - "scripts/test_source_installer.py"
      - "src/**"
      - "vendor/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-install.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "docs/next/INSTALL.md"
      - "justfile"
      - "rust-toolchain.toml"
      - "scripts/source_install_check.py"
      - "scripts/install-from-source.sh"
      - "scripts/test_source_installer.py"
      - "src/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: source-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-root:
    name: clean source install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: source-install

      - name: Install into a clean root
        run: python3 scripts/source_install_check.py

      - name: Verify source installer preflight
        run: python3 -m unittest scripts.test_source_installer
